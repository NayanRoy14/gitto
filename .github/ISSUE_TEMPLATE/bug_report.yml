name: Bug report
description: Something in gitto isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get instead?
      placeholder: |
        I ran `gitto save`, expected it to commit my changes, but got...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gitto version
      description: Run `gitto --version`
      placeholder: "0.2.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Run `node --version`
      placeholder: "v22.x.x"
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: Terminal / shell
      description: >-
        Which terminal app and shell? (e.g. Windows Terminal + PowerShell,
        iTerm2 + zsh, GNOME Terminal + bash). If gitto fell back to the
        plain-text mode instead of the interactive menu, mention that too.
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. `git init` a new folder
        2. Create a file
        3. Run `gitto save`
        4. ...
    validations:
      required: false
